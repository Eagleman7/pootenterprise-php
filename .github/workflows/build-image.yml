name: Build PHP image

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eagleman7/pootenterprise-php

jobs:
  build:
    name: Build and test image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      php-version: ${{ steps.version.outputs.php }}
      base-image: ${{ steps.version.outputs.base }}
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # The image tag is the exact PHP version from the Dockerfile's FROM line plus the commit SHA.
      - name: Read PHP version from Dockerfile
        id: version
        run: |
          set -eu
          base=$(sed -nE 's/^FROM ([^ ]+).*/\1/p' Dockerfile | head -n1)
          php=$(sed -nE 's/^FROM php:([0-9]+\.[0-9]+\.[0-9]+)-.*/\1/p' Dockerfile | head -n1)
          if [ -z "$php" ]; then
            echo "::error file=Dockerfile::FROM must use an exact php:X.Y.Z-* tag, found: $base"
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "tag=$php-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PRs load one native image for smoke tests; published builds are multi-arch.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PHP version
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          set -eux
          image='${{ steps.meta.outputs.tags }}'
          test "$(docker run --rm --entrypoint php "$image" -r 'echo PHP_VERSION;')" = '${{ steps.version.outputs.php }}'

      - name: Verify PHP extensions
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          set -eux
          image='${{ steps.meta.outputs.tags }}'
          docker run --rm --entrypoint php "$image" -m | tee /tmp/php-modules
          grep -qx 'gd' /tmp/php-modules
          grep -qx 'mysqli' /tmp/php-modules
          docker run --rm --entrypoint php "$image" -r \
            'if (!function_exists("gd_info")) { exit(1); } $gd = gd_info(); if (empty($gd["FreeType Support"]) || empty($gd["JPEG Support"])) { var_export($gd); exit(1); }'

      - name: Verify PHP-FPM starts
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        run: |
          set -eux
          image='${{ steps.meta.outputs.tags }}'
          docker run -d --name php-fpm-smoke "$image"
          trap 'docker logs php-fpm-smoke; docker rm -f php-fpm-smoke' EXIT
          sleep 2
          test "$(docker inspect --format='{{.State.Running}}' php-fpm-smoke)" = true

  release:
    name: Create GitHub release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for the published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          PHP_VERSION: ${{ needs.build.outputs.php-version }}
          BASE_IMAGE: ${{ needs.build.outputs.base-image }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -eu
          notes=$(printf 'Image: `%s`\nDigest: `%s`\nBase image: `%s`\n' "$IMAGE" "$DIGEST" "$BASE_IMAGE")
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PHP $PHP_VERSION (${GITHUB_SHA::7})" \
            --notes "$notes" \
            --generate-notes \
            --latest
